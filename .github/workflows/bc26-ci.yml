name: Cortech BC26 Local CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted
    env:
      BC_SERVER_INSTANCE: ${{ secrets.BC_SERVER_INSTANCE }}
      BC_TENANT: ${{ secrets.BC_TENANT }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Copy AL Symbols
        shell: pwsh
        run: |
         $source = "C:\Users\Admin\Documents\AL\ALProject3\.alpackages"
         $dest = "${{ github.workspace }}\.alpackages"

         if (!(Test-Path $source)) {
         throw "Source symbol folder not found: $source"
         }

         New-Item -ItemType Directory -Force -Path $dest | Out-Null

         Copy-Item "$source\*.app" -Destination $dest -Force

         Write-Host "Copied symbols:"
         Get-ChildItem $dest


      - name: Compile AL Extension
        shell: pwsh
        run: |
          # 1. Intelligently locate alc.exe
          $alcPath = (Get-ChildItem "C:\Users\*\.vscode\extensions\ms-dynamics-smb.al-*\bin\win32\alc.exe" -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName

          if (-not $alcPath) {
              Write-Error "alc.exe not found. Is the AL extension installed?"
              exit 1
          }
          Write-Host "Using alc.exe at: $alcPath"

          # 2. Create output folder
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\output" | Out-Null

          # 3. Compile the code
          & $alcPath /project:"${{ github.workspace }}" /packagecachepath:"${{ github.workspace }}\.alpackages" /out:"${{ github.workspace }}\output\CortechProject.app"

          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Compilation Successful!"

      - name: Run AL Tests
        shell: pwsh
        run: |
          # 1. Run AL tests
          $testApp = "${{ github.workspace }}\output\ALProject3.Test.app"
          if (Test-Path $testApp) {
              Write-Host "Running tests..."
          } else {
              Write-Host "No test app found, skipping tests"
          }

      - name: Publish and Deploy to Cortech BC26
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          # 1. Load the Business Central Administration modules
          $navTool = (Get-ChildItem -Path "C:\Program Files\Microsoft Dynamics 365 Business Central" -Recurse -Filter "NavAdminTool.ps1" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $navTool) { Write-Error "NavAdminTool.ps1 not found."; exit 1 }
          Import-Module $navTool

          # 2. Extract metadata from our newly compiled App file
          $appFile = "${{ github.workspace }}\output\CortechProject.app"
          $newAppName = (Get-NAVAppInfo -Path $appFile).Name
          $newAppVersion = (Get-NAVAppInfo -Path $appFile).Version

          # 3. Check if any version of this app is ALREADY on the server
          $existingApp = Get-NAVAppInfo -ServerInstance $env:BC_SERVER_INSTANCE -Name $newAppName -ErrorAction SilentlyContinue

          # 4. Check if app is already installed

          if ($existingApp)
          {
           Write-Host "Existing version found: $($existingApp.Version)"
          }
          else{
          Write-Host "No previous version found."
          }

           # 5. Publish the app

          Write-Host "Publishing app..."

          try
          {
          Publish-NAVApp `
          -ServerInstance $env:BC_SERVER_INSTANCE `
          -Path $appFile `
          -SkipVerification
 
           Write-Host "Publish successful."
          }
          catch
          {
          Write-Error $_
          exit 1
          }

          # 6. Synchronize schema

          Write-Host "Synchronizing schema..."

          try
          {
          Sync-NAVApp `
          -ServerInstance $env:BC_SERVER_INSTANCE `
          -Name $newAppName `
          -Version $newAppVersion `
          -Tenant $env:BC_TENANT

          Write-Host "Synchronization successful."
          }
          catch
          {
          Write-Error $_
          exit 1
          }

          # 7. Install or upgrade
          if ($existingApp)
          {
          Write-Host "Running data upgrade..."

          try
          {
          Start-NAVAppDataUpgrade `
            -ServerInstance $env:BC_SERVER_INSTANCE `
            -Name $newAppName `
            -Version $newAppVersion

           Write-Host "Upgrade completed."
          }
          catch
          {
          Write-Error $_
          exit 1
          }
          }
          else
          {
          Write-Host "Installing application..."

          try
          {
          Install-NAVApp `
            -ServerInstance $env:BC_SERVER_INSTANCE `
            -Name $newAppName `
            -Version $newAppVersion `
            -Tenant $env:BC_TENANT

          Write-Host "Installation completed."
          }
          catch
          {
          Write-Error $_
          exit 1
          }
          }
      - name: Archive Successful Deployment
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $backupRoot = "C:\BCAppBackups\ALProject3"
          New-Item -ItemType Directory -Force -Path $backupRoot | Out-Null

          $appFile = "${{ github.workspace }}\output\CortechProject.app"
          $version = (Get-NAVAppInfo -Path $appFile).Version.ToString()

          $backupPath = Join-Path $backupRoot "CortechProject-$version.app"
          Copy-Item -Path $appFile -Destination $backupPath -Force

          Write-Host "Backed up version $version to $backupPath"